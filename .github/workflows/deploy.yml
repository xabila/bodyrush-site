name: Deploy BodyRush Site to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages (bodyrush-site)
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare API token
        id: cf_token
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN missing, skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.cf_token.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Stage Public Web Assets
        if: steps.cf_token.outputs.ok == 'true'
        run: |
          mkdir -p _dist
          rsync -av \
            --exclude='_dist' \
            --exclude='.git*' \
            --exclude='.impeccable' \
            --exclude='scripts' \
            --exclude='DESIGN.md' \
            --exclude='PRODUCT.md' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='.DS_Store' \
            ./ _dist/

      - name: Deploy to Cloudflare Pages
        if: steps.cf_token.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6e924e77d063c32f4b8b2654054af323"
          command: pages deploy _dist --project-name=bodyrush-site --branch=main
