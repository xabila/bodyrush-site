name: Deploy BodyRush Site to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages (bodyrush-site)
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage Public Web Assets
        run: |
          mkdir -p _dist
          rsync -av \
            --exclude='_dist' \
            --exclude='.git*' \
            --exclude='.impeccable' \
            --exclude='scripts' \
            --exclude='DESIGN.md' \
            --exclude='PRODUCT.md' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='.DS_Store' \
            ./ _dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6e924e77d063c32f4b8b2654054af323"
          command: pages deploy _dist --project-name=bodyrush-site --branch=main
